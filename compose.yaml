version: '3'
services:
    webpack:
        build: .
        ports:
            - '8080:8080'
        volumes:
            - .:/app
        command: npm run webpack-dev-server -- --open

    wordpress:
        image: wordpress:latest
        ports:
            - '8000:80'
        environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DB_USER: root
            WORDPRESS_DB_PASSWORD: root
            WORDPRESS_TABLE_PREFIX: wp_
        volumes:
            - wordpress:/var/www/html
            - .:/var/www/html/wp-content/themes/custom-theme
        depends_on:
            - db

    php:
        image: composer:latest
        volumes:
            - .:/app
        working_dir: /app
        command: composer install --no-interaction --no-scripts --prefer-dist

    db:
        image: mysql:5.7
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: wordpress
        volumes:
            - wordpress-data:/var/lib/mysql

volumes:
    wordpress:
    wordpress-data:
